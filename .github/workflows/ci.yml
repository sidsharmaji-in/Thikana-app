name: GharDekho Production CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  integration-and-e2e:
    name: Test & E2E Verification
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install Root Dependencies
        run: npm ci || npm install

      - name: 📦 Install Server Dependencies
        run: cd server && (npm ci || npm install)

      - name: 🧪 Run All Production Integration Suites (386 Tests)
        run: npm test

      - name: 🌐 Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: 🚀 Start GharDekho Backend Server in Background
        run: |
          node server/src/index.js &
          npx wait-on http://localhost:4000/api/health -t 30000

      - name: 🎭 Run Headless Playwright E2E Test Suite
        run: npx playwright test

      - name: 📊 Upload Playwright Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-node-${{ matrix.node-version }}
          path: playwright-report/
          retention-days: 14
