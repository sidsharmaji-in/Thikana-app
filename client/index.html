<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#06090E" />
  <title>GharDekho 🏠 | India's Trusted Student & Professional Rental Marketplace</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Screen Reader Live Region for TalkBack / VoiceOver (Slice 8) -->
  <div id="a11yAnnouncer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <!-- Main Responsive Application Container -->
  <main class="device-shell mode-wide" id="deviceShell">
    
    <!-- Offline Stale Data Warning Banner (Slice 8) -->
    <div class="offline-banner" id="offlineBanner" role="status" style="display: none;">
      <span class="offline-dot"></span>
      <span>⚠️ Offline Mode · Loaded from device storage (Showing cached listings)</span>
    </div>

    <!-- Top Navigation Header (Desktop & Mobile Unified) -->
    <header class="app-header" role="banner">
      <div class="header-inner">
        
        <!-- Brand Identity -->
        <div class="brand-container" onclick="GharDekho.setTab('khojo')" role="button" tabindex="0" aria-label="GharDekho Home">
          <div class="brand-logo" aria-hidden="true">🏠</div>
          <div class="brand-text">
            <div class="brand-name" data-i18n="brand.name">Ghar<span>Dekho</span></div>
            <div class="brand-tagline" data-i18n="brand.tagline">Zero-Brokerage Student Housing</div>
          </div>
        </div>

        <!-- Central Search & Location Bar -->
        <div class="search-command-bar" role="search">
          <!-- City Quick Pill -->
          <button class="location-pill" id="cityPill" onclick="GharDhundo.resetFilters()" title="Change city" aria-label="Selected city: All cities. Click to filter.">
            <span class="pill-icon">📍</span>
            <span class="pill-text" data-i18n="nav.all_cities">All Cities</span>
          </button>
          
          <div class="search-divider"></div>

          <!-- Keyword Input -->
          <div class="search-input-box">
            <span class="search-icon" aria-hidden="true">🔍</span>
            <input 
              type="text" 
              id="searchInput" 
              data-i18n-placeholder="nav.search_placeholder"
              placeholder="Search by coaching (Allen, Resonance), metro, locality..." 
              aria-label="Search rental properties by coaching, metro, or locality" 
              autocomplete="off"
            />
            <!-- Voice Search Button (Slice P11) -->
            <button class="voice-search-btn" id="voiceSearchBtn" onclick="GharDekho.toggleVoiceSearch()" title="Search by Voice (Hindi / Hinglish)" aria-label="Search by Voice">
              🎙️
            </button>
          </div>

          <!-- Filter Sheet Button -->
          <button class="filter-btn-trigger" onclick="GharDekho.openFilterSheet()" title="Open Filters" aria-label="Open Filter Options Sheet">
            <span class="filter-icon">⚙️</span>
            <span class="filter-btn-label" data-i18n="nav.filters">Filters</span>
          </button>
        </div>

        <!-- Top Right Actions & Controls -->
        <div class="header-actions">
          
          <!-- Notification Bell with Unread Badge -->
          <button class="notif-bell-btn" id="notifBellBtn" onclick="GharDekho.toggleNotificationDrawer()" title="View Notifications" aria-label="Notifications & Alerts">
            <span class="bell-icon" aria-hidden="true">🔔</span>
            <span class="notif-badge" id="notifBadge" style="display: none;" aria-label="Unread notifications count">0</span>
          </button>

          <!-- Saved Shortlist Quick Shortcut (Desktop) -->
          <button class="header-icon-btn desktop-only" onclick="GharDekho.setTab('saved')" title="Shortlisted Rooms" aria-label="Saved Rooms">
            <span class="header-btn-icon">❤️</span>
          </button>

          <!-- In-App Chat Quick Shortcut (Desktop) -->
          <button class="header-icon-btn desktop-only" onclick="GharDekho.setTab('messages')" title="Messages & Visits" aria-label="In-App Messages">
            <span class="header-btn-icon">💬</span>
          </button>

          <!-- Role Switcher Segmented Control -->
          <div class="role-toggle-group" role="group" aria-label="User Profile Role">
            <button class="role-btn active" id="roleTenantBtn" aria-pressed="true">
              <span class="role-emoji">🎓</span> <span data-i18n="role.tenant">Kirayedaar</span>
            </button>
            <button class="role-btn" id="roleOwnerBtn" aria-pressed="false">
              <span class="role-emoji">🔑</span> <span data-i18n="role.owner">Owner</span>
            </button>
          </div>

          <!-- Authentication Profile / Sign In Pill (Slice P2) -->
          <button class="theme-toggle-btn" id="headerAuthBtn" onclick="GharDekho.openAuthModal()" title="Sign In with Mobile OTP" aria-label="Sign In with Mobile OTP">
            <span id="headerAuthLabel" data-i18n="nav.sign_in">👤 Sign In</span>
          </button>

          <!-- Viewport Simulator Toggle (Mobile vs Full Screen) -->
          <button class="viewport-btn" id="viewportBtn" onclick="GharDhundo.toggleViewport()" title="Toggle Viewport Layout" aria-label="Toggle Wide Viewport Simulator">
            📱 Mobile
          </button>

          <!-- Clean Dark/Light Mode Toggle -->
          <button class="theme-toggle-btn" id="themeToggleBtn" onclick="GharDekho.toggleDarkMode()" title="Toggle Dark/Light Mode" aria-label="Toggle Dark/Light Theme">
            🌓 <span class="theme-name-label" id="themeNameLabel" data-i18n="nav.dark_mode">Dark Mode</span>
          </button>

          <!-- Bilingual Hindi / English Toggle (Section 14 Plan) -->
          <button class="theme-toggle-btn" id="langToggleBtn" onclick="GharDekho.toggleLanguage()" title="Switch Language (English / हिंदी)" aria-label="Toggle Language">
            🌐 <span id="langNameLabel">हिंदी</span>
          </button>

        </div>

      </div>

      <!-- Quick Category & City Navigation Bar -->
      <nav class="quick-chips-row" id="quickChips" aria-label="Quick Hub Filters">
        <button class="chip active" onclick="GharDekho.setCity('All')" data-i18n="nav.all_hubs">All Hubs</button>
        <button class="chip" onclick="GharDekho.setCity('Kota')" data-i18n="nav.kota_hub">🎯 Kota (NEET/JEE Hub)</button>
        <button class="chip" onclick="GharDekho.setCity('Pune')" data-i18n="nav.pune_hub">💼 Pune (IT & Colleges)</button>
        <button class="chip" onclick="GharDekho.setCity('Jaipur')" data-i18n="nav.jaipur_hub">🎓 Jaipur (MNIT & Uni)</button>
        <button class="chip" onclick="GharDekho.setCity('Delhi')" data-i18n="nav.delhi_hub">🏛️ Delhi (Metro & UPSC)</button>
      </nav>

    </header>

    <!-- Main Dynamic Application Content Container -->
    <section class="app-content" id="appContent" role="region" aria-label="Main Rental Content View">
      <!-- Injected dynamically by app.js -->
    </section>

    <!-- Bottom Navigation Bar (Thumb Friendly for Mobile) -->
    <nav class="bottom-nav" id="bottomNav" aria-label="Bottom Navigation">
      <button class="nav-item active" onclick="GharDekho.setTab('khojo')">
        <span class="nav-icon">🏠</span>
        <span data-i18n="nav.khojo">Khojo</span>
      </button>
      <button class="nav-item" onclick="GharDekho.setTab('map')">
        <span class="nav-icon">🗺️</span>
        <span data-i18n="nav.map">Map</span>
      </button>
      <button class="nav-item" onclick="GharDekho.setTab('saved')">
        <span class="nav-icon">❤️</span>
        <span data-i18n="nav.saved">Saved</span>
      </button>
      <button class="nav-item" onclick="GharDekho.setTab('messages')">
        <span class="nav-icon">💬</span>
        <span data-i18n="nav.chat">Chat</span>
      </button>
      <button class="nav-item" onclick="GharDekho.setTab('profile')">
        <span class="nav-icon">👤</span>
        <span data-i18n="nav.profile">Profile</span>
      </button>
    </nav>

  </main>

  <!-- Detailed Property Bottom Sheet Modal -->
  <div class="modal-overlay" id="detailModal" role="dialog" aria-modal="true" aria-label="Property Details Sheet">
    <div class="detail-sheet" id="modalContent">
      <!-- Injected dynamically on click -->
    </div>
  </div>

  <!-- Filter Bottom Sheet Modal (Slice 2) -->
  <div class="modal-overlay" id="filterModal" role="dialog" aria-modal="true" aria-label="Filters Sheet">
    <div class="detail-sheet" id="filterModalContent">
      <!-- Injected dynamically by openFilterSheet() -->
    </div>
  </div>

  <!-- Submodal Dialog (Slice 4: Roommate Vibe & Waitlist Sheet) -->
  <div class="submodal-overlay" id="subModal" role="dialog" aria-modal="true" aria-label="Waitlist and Roommate Dialog">
    <div class="submodal-box" id="subModalContent">
      <!-- Injected dynamically -->
    </div>
  </div>

  <!-- Notification Center Drawer Modal (Slice 7) -->
  <div class="modal-overlay" id="notifModal" role="dialog" aria-modal="true" aria-label="Notification Center">
    <div class="detail-sheet notif-sheet" id="notifModalContent">
      <!-- Injected dynamically by GharDekho.renderNotifications() -->
    </div>
  </div>

  <!-- Phone OTP Login Modal (Slice P2 Production Auth) -->
  <div class="submodal-overlay" id="authModal" role="dialog" aria-modal="true" aria-label="Sign In with Indian Mobile">
    <div class="submodal-box" id="authModalContent" style="max-width: 440px; margin: auto;">
      <!-- Injected dynamically by GharDekho.renderAuthModal() -->
    </div>
  </div>

  <!-- Floating Toast Message Notification -->
  <div class="toast-msg" id="toastMsg" role="alert" aria-live="assertive"></div>

  <script src="js/i18n.js"></script>
  <script src="js/voiceSearch.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
