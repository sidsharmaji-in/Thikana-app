<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0B0F17" />
  <title>GharDekho 🏠 | India's Trusted Student & Professional Rental Marketplace</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Mobile Device Simulator Frame -->
  <main class="device-shell" id="deviceShell">
    
    <!-- Accessibility Live Region for Screen Readers / TalkBack -->
    <div id="a11yAnnouncer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

    <!-- Offline Stale Data Warning Banner (Slice 8) -->
    <div class="offline-banner" id="offlineBanner" role="status" style="display: none;">
      <span class="offline-dot"></span>
      <span>⚠️ Offline Mode · Showing cached rooms & shortlist</span>
    </div>

    <!-- App Header Sticky -->
    <header class="app-header" role="banner">
      <div class="header-top">
        <div class="brand-container">
          <div class="brand-logo" aria-hidden="true">🏠</div>
          <div class="brand-name">Ghar<span>Dekho</span></div>
        </div>

        <div style="display: flex; align-items: center; gap: 6px;">
          <!-- Notification Bell with Unread Badge -->
          <button class="notif-bell-btn" id="notifBellBtn" onclick="GharDekho.toggleNotificationDrawer()" title="View Notifications" aria-label="Notifications & Alerts">
            <span class="bell-icon" aria-hidden="true">🔔</span>
            <span class="notif-badge" id="notifBadge" style="display: none;" aria-label="Unread notifications count">0</span>
          </button>
          <!-- Role Switcher -->
          <div class="role-toggle-group" role="group" aria-label="User Profile Role">
            <button class="role-btn active" id="roleTenantBtn" aria-pressed="true">Kirayedaar</button>
            <button class="role-btn" id="roleOwnerBtn" aria-pressed="false">Owner</button>
          </div>
          <!-- Viewport Mode Toggle -->
          <button class="viewport-btn" id="viewportBtn" onclick="GharDhundo.toggleViewport()" title="Toggle Mobile / Wide View" aria-label="Toggle Wide Viewport Simulator">
            💻 Wide
          </button>
        </div>
      </div>

      <!-- Location Indicator & City Quick Select -->
      <div class="location-row" role="region" aria-label="Current city selection">
        <div class="location-pill" id="cityPill" onclick="GharDhundo.resetFilters()" tabindex="0" role="button" aria-label="Selected city: All cities. Click to reset.">
          📍 All Cities
        </div>
        <div style="font-size: 11px; color: var(--text-muted);" aria-hidden="true">
          Kota • Pune • Jaipur • Delhi
        </div>
      </div>

      <!-- Search Input Bar -->
      <div class="search-bar-wrap" role="search">
        <div class="search-input-box">
          <span class="search-icon" aria-hidden="true">🔍</span>
          <input type="text" id="searchInput" placeholder="Search by coaching, metro, locality (e.g. Allen, Hinjawadi)..." aria-label="Search rental properties by coaching, metro, or locality" />
        </div>
        <button class="filter-btn-trigger" onclick="GharDekho.openFilterSheet()" title="Open Filters" aria-label="Open Filter Options Sheet">
          ⚙️
        </button>
      </div>
    </header>

    <!-- Quick Horizontal Filter Chips -->
    <nav class="quick-chips-row" id="quickChips" aria-label="Quick Filters">
      <button class="chip active" onclick="GharDekho.setCity('All')">All</button>
      <button class="chip" onclick="GharDekho.setCity('Kota')">🎯 Kota (NEET/JEE)</button>
      <button class="chip" onclick="GharDekho.setCity('Pune')">💼 Pune (IT Hub)</button>
      <button class="chip" onclick="GharDekho.setCity('Jaipur')">🎓 Jaipur (College)</button>
      <button class="chip" onclick="GharDekho.setCity('Delhi')">🏛️ Delhi (Metro)</button>
    </nav>

    <!-- Main Scrollable App Content View -->
    <section class="app-content" id="appContent">
      <!-- Injected dynamically by app.js -->
    </section>

    <!-- Bottom Navigation Bar (Thumb Friendly) -->
    <nav class="bottom-nav" id="bottomNav" aria-label="Bottom Navigation">
      <button class="nav-item active" onclick="GharDekho.setTab('khojo')">
        <span class="nav-icon">🏠</span>
        <span>Khojo</span>
      </button>
      <button class="nav-item" onclick="GharDekho.setTab('map')">
        <span class="nav-icon">🗺️</span>
        <span>Map</span>
      </button>
      <button class="nav-item" onclick="GharDekho.setTab('saved')">
        <span class="nav-icon">❤️</span>
        <span>Saved</span>
      </button>
      <button class="nav-item" onclick="GharDekho.setTab('messages')">
        <span class="nav-icon">💬</span>
        <span>Chat</span>
      </button>
      <button class="nav-item" onclick="GharDekho.setTab('profile')">
        <span class="nav-icon">👤</span>
        <span>Profile</span>
      </button>
    </nav>

  </main>

  <!-- Detailed Property Bottom Sheet Modal -->
  <div class="modal-overlay" id="detailModal" role="dialog" aria-modal="true" aria-label="Property Details Sheet">
    <div class="detail-sheet" id="modalContent">
      <!-- Injected dynamically on click -->
    </div>
  </div>

  <!-- Filter Bottom Sheet Modal (Slice 2) -->
  <div class="modal-overlay" id="filterModal" role="dialog" aria-modal="true" aria-label="Filters Sheet">
    <div class="detail-sheet" id="filterModalContent">
      <!-- Injected dynamically by openFilterSheet() -->
    </div>
  </div>

  <!-- Submodal Dialog (Slice 4: Roommate Vibe & Waitlist Sheet) -->
  <div class="submodal-overlay" id="subModal" role="dialog" aria-modal="true" aria-label="Waitlist and Roommate Dialog">
    <div class="submodal-box" id="subModalContent">
      <!-- Injected dynamically -->
    </div>
  </div>

  <!-- Notification Center Bottom Sheet Modal (Slice 7) -->
  <div class="modal-overlay" id="notifModal" role="dialog" aria-modal="true" aria-label="Notification Center">
    <div class="detail-sheet notif-sheet" id="notifModalContent">
      <!-- Injected dynamically by GharDekho.renderNotifications() -->
    </div>
  </div>

  <!-- Toast Notification Message -->
  <div class="toast-msg" id="toastMsg"></div>

  <script src="js/app.js"></script>
</body>
</html>
